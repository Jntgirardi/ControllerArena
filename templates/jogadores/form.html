{% extends "base.html" %}

{% block title %}{{ 'Editar' if acao == 'editar' else 'Novo' }} Jogador - FPS Arena{% endblock %}

{% block content %}
<main class="w-full max-w-[1024px] mx-auto px-4 md:px-6 py-8 flex flex-col gap-6">

  <!-- Header with Back Button -->
  <div class="flex items-center gap-4 border-b border-border-subtle pb-4">
    <a href="{{ url_for('listar_jogadores') }}" class="bg-surface-white border border-border-subtle hover:bg-surface text-text-muted hover:text-on-surface font-bold text-xs px-4 py-2 rounded-lg transition-colors flex items-center gap-1.5 text-decoration-none shadow-sm">
      <span class="material-symbols-outlined text-[16px]">arrow_back</span> Voltar
    </a>
    <h1 class="text-2xl font-headline font-bold text-on-surface">
      {{ 'Editar Jogador' if acao == 'editar' else 'Cadastrar Jogador' }}
    </h1>
  </div>

  <!-- Form Card Container -->
  <div class="w-full max-w-[500px]">
    <div class="bg-surface-white rounded-xl border border-border-subtle shadow-sm p-card-padding">
      <form method="post" class="space-y-5">
        
        <!-- Nick & Nome -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-xs text-on-surface mb-1" for="nick">Nick *</label>
            <input 
              type="text" 
              name="nick" 
              id="nick"
              value="{{ dados.get('nick', '') }}" 
              required
              class="w-full border border-border-subtle rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary bg-surface-white transition-colors text-on-surface"
            >
          </div>
          <div>
            <label class="block font-bold text-xs text-on-surface mb-1" for="nome">Nome *</label>
            <input 
              type="text" 
              name="nome" 
              id="nome"
              value="{{ dados.get('nome', dados.get('nome_real', '')) }}" 
              required
              class="w-full border border-border-subtle rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary bg-surface-white transition-colors text-on-surface"
            >
          </div>
        </div>



        <!-- Contato -->
        <div>
          <label class="block font-bold text-xs text-on-surface mb-1" for="contato">Contato</label>
          <input 
            type="email" 
            name="contato" 
            id="contato"
            value="{{ dados.get('contato', '') }}"
            class="w-full border border-border-subtle rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary bg-surface-white transition-colors text-on-surface"
          >
        </div>

        <!-- Jogo Principal & Vinculação de Campeonato -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-xs text-on-surface mb-1" for="jogoSelect">Jogo Principal *</label>
            <select 
              name="jogo_principal" 
              id="jogoSelect" 
              onchange="toggleCamposJogo()"
              class="w-full border border-border-subtle rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary bg-surface-white text-on-surface-variant cursor-pointer"
            >
              <option value="CS2" {% if dados.get('jogo_principal') == 'CS2' %}selected{% endif %}>CS2</option>
              <option value="Valorant" {% if dados.get('jogo_principal') == 'Valorant' %}selected{% endif %}>Valorant</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-xs text-on-surface mb-1" for="campeonato_id">Campeonato Vinculado</label>
            <select 
              name="campeonato_id" 
              id="campeonato_id"
              class="w-full border border-border-subtle rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary bg-surface-white text-on-surface-variant cursor-pointer"
            >
              <option value="">Selecionar depois</option>
              {% for camp in campeonatos %}
              <option value="{{ camp._id }}" {% if dados.get('campeonato_id') and dados.get('campeonato_id')|string == camp._id|string %}selected{% endif %}>{{ camp.nome }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Campos Extras CS2 -->
        <div id="campos_cs2" class="pt-2">
        </div>

        <!-- Campos Extras Valorant -->
        <div id="campos_valorant" class="pt-2" style="display:none">
        </div>

        <!-- Submit Button -->
        <div class="pt-4">
          <button type="submit" class="w-full bg-primary hover:bg-primary-container text-on-primary font-bold text-xs rounded-lg py-3 transition-colors shadow-sm cursor-pointer flex items-center justify-center gap-1.5">
            <span class="material-symbols-outlined text-[18px]">{% if acao == 'editar' %}save{% else %}add{% endif %}</span>
            {{ 'Salvar Alterações' if acao == 'editar' else 'Cadastrar Jogador' }}
          </button>
        </div>
      </form>
    </div>
  </div>

</main>
{% endblock %}

{% block scripts %}
<script>
function toggleCamposJogo() {
  const jogo = document.getElementById('jogoSelect').value;
  document.getElementById('campos_cs2').style.display = jogo === 'CS2' ? '' : 'none';
  document.getElementById('campos_valorant').style.display = jogo === 'Valorant' ? '' : 'none';
}
toggleCamposJogo();
</script>
{% endblock %}
